<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Awesome Grok Bot</title>
  <meta name="description" content="Curated directory for Grok Bot — always-on AI teammates with their own cloud computer." />
  <meta property="og:title" content="Awesome Grok Bot" />
  <meta property="og:description" content="Curated directory for always-on AI teammates." />
  <meta property="og:image" content="./assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="./assets/mark.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#">
      <img src="./assets/mark.png" alt="" width="36" height="36" />
      <span>Awesome Grok Bot</span>
    </a>
    <nav>
      <a href="#playbook" data-i18n="nav.playbook">Playbook</a>
      <a href="#catalog" data-i18n="nav.catalog">Catalog</a>
      <a href="#prompts" data-i18n="nav.prompts">Prompts</a>
      <a href="https://github.com/RongleCat/awesome-grok-bot">GitHub</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="on">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </nav>
  </header>

  <section class="hero">
    <img class="banner" src="./assets/banner.png" alt="Awesome Grok Bot" />
    <p class="lede" data-i18n="hero.lede"></p>
    <div class="stats">
      <div><b id="stat-entries">—</b><span data-i18n="stat.entries">entries</span></div>
      <div><b id="stat-sections">—</b><span data-i18n="stat.sections">sections</span></div>
      <div><b>10</b><span data-i18n="stat.prompts">playbook prompts</span></div>
    </div>
  </section>

  <section id="playbook" class="wrap">
    <h2 data-i18n="playbook.title">Playbook — read this first</h2>
    <ol id="playbook-list" class="rules"></ol>
  </section>

  <section id="catalog" class="wrap">
    <div class="toolbar">
      <input id="q" type="search" data-i18n-placeholder="search" placeholder="Search" />
      <div id="chips" class="chips"></div>
    </div>
    <div id="groups"></div>
  </section>

  <section id="prompts" class="wrap">
    <h2 data-i18n="prompts.title">Playbook prompts</h2>
    <p class="muted" data-i18n="prompts.note"></p>
    <div id="prompt-list" class="cards"></div>
  </section>

  <footer class="wrap foot">
    <p data-i18n="footer"></p>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
